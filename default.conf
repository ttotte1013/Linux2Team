server {
    listen       80;
    server_name  localhost;

    # HTML 파일들이 위치할 경로 지정
    location / {
        root   /usr/share/nginx/html;
        index  index.html select_mode.html;
        try_files $uri $uri/ /index.html;
    }

    # 500, 502, 503, 504 서버 에러 발생 시 처리
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
