<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TOEIC WORD QUIZ - QUIZ</title>
    <style>
        /* 기본 페이지 및 전체 요소 정렬 설정 */
        body {
            background-color: #faf8f5; 
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 퀴즈 전체 영역 스타일 */
        .quiz-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 420px;
            position: relative;
        }

        /* 현재 퀴즈 진행 상태 표시 */
        .quiz-progress {
            font-size: 14px;
            color: #466255; 
            font-weight: 700;
            text-align: left;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        /* 퀴즈 문제 텍스트 스타일 */
        .quiz-question {
            color: #004732; 
            font-size: 32px; 
            font-weight: 700;
            text-align: center;
            margin-bottom: 36px;
            word-wrap: break-word;
        }

        /* 선택지 버튼 그룹 레이아웃 */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        /* 각 선택지 버튼 기본 스타일 */
        .btn-option {
            background-color: #ffffff;
            border: 1px solid #e2ebda;
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            color: #2c3a1a; 
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            width: 100%;
            box-sizing: border-box;
        }

        /* 버튼 호버 시 효과 */
        .btn-option:hover {
            background-color: #edf5ed;
            border-color: #a7bfa4;
            transform: translateY(-2px); 
        }

        /* 정답 및 해설 표시 영역 */
        .explanation-box {
            display: none; /* 평소에는 숨김 처리 */
            background-color: #faf8f5;
            border-left: 4px solid #004732;
            padding: 16px;
            border-radius: 4px 12px 12px 4px;
            margin-bottom: 24px;
            text-align: left;
        }

        /* 해설 제목 영역 */
        .explanation-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        /* 정답/오답 결과에 따른 텍스트 색상 */
        .status-correct { color: #004732; }
        .status-wrong { color: #b91c1c; }

        /* 예문 및 해석 영역 스타일 */
        .explanation-example {
            font-size: 14px;
            color: #466255;
            line-height: 1.5;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e2ebda;
        }

        /* 하단 푸터 영역 (다음 버튼 위치) */
        .quiz-footer {
            display: flex;
            justify-content: flex-end; 
        }

        /* 다음 문제 이동 버튼 스타일 */
        .btn-next {
            background-color: #004732; 
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-next:hover {
            background-color: #0b3c2a;
        }
    </style>
</head>

<body>
    <div class="quiz-container">
        <div id="progress" class="quiz-progress">QUIZ 01 / 10</div>
        <div id="question" class="quiz-question">Loading...</div>

        <div id="options" class="options-group">
            </div>

        <div id="explanation" class="explanation-box">
            <div id="exp-title" class="explanation-title"></div>
            <div id="exp-text"></div>
            <div id="exp-example" class="explanation-example"></div>
        </div>

        <div class="quiz-footer">
            <button id="next-btn" class="btn-next">NEXT →</button>
        </div>
    </div>

    <script>
        // 퀴즈 데이터 예시 (백엔드에서 데이터가 들어올 형식)
        const mockData = {
            quiz_id: 3,
            current_num: 1,
            total_num: 10,
            question: "considerable",
            options: ["사려 깊은", "상당한", "고려해 볼 만한", "보수적인"],
            answer: 2,
            example: "The project will require a considerable amount of time.",
            example_ko: "그 프로젝트는 상당한 양의 시간을 필요로 할 것이다."
        };

        let isAnswered = false; // 정답 선택 여부 확인을 위한 플래그 (중복 클릭 방지)

        // 퀴즈 화면 로드 및 데이터 바인딩 함수
        function loadQuiz(data) {
            isAnswered = false;
            document.getElementById("explanation").style.display = "none"; // 해설 박스 초기화
            
            document.getElementById("progress").innerText = `QUIZ ${String(data.current_num).padStart(2, '0')} / ${data.total_num}`;
            document.getElementById("question").innerText = data.question;
            
            const optionsGroup = document.getElementById("options");
            optionsGroup.innerHTML = ""; 

            // 선택지 버튼 생성
            data.options.forEach((optionText, index) => {
                const button = document.createElement("button");
                button.className = "btn-option";
                button.innerText = `${index + 1}. ${optionText}`;
                
                button.onclick = () => {
                    if (!isAnswered) {
                        handleOptionClick(index + 1, data);
                    }
                };

                optionsGroup.appendChild(button);
            });
        }

        // 선택지 클릭 시 정답 여부 판별 및 해설 화면 출력
        function handleOptionClick(selectedIndex, data) {
            isAnswered = true;
            const expBox = document.getElementById("explanation");
            const expTitle = document.getElementById("exp-title");
            const expText = document.getElementById("exp-text");
            const expExample = document.getElementById("exp-example");

            const correctAnswerText = `${data.answer}. ${data.options[data.answer - 1]}`;

            // 정답/오답에 따른 결과 메시지 설정
            if (selectedIndex === data.answer) {
                // 정답일 때
                expTitle.className = "explanation-title status-correct";
                expTitle.innerText = "정답입니다!";
            } else {
                // 오답일 때
                expTitle.className = "explanation-title status-wrong";
                expTitle.innerText = "오답입니다.";
            }

            // 정답 정보 및 예문 내용 바인딩
            expText.innerHTML = `정답: <strong>${correctAnswerText}</strong>`;
            expExample.innerHTML = `<strong>💡 예문 공부하기</strong><br>${data.example}<br><span style="font-size: 13px; color: #7a8b83;">${data.example_ko}</span>`;
            
            // 결과 화면 표시
            expBox.style.display = "block";
        }

        // 페이지 로드 시 퀴즈 초기화
        window.onload = function() {
            loadQuiz(mockData);
        };
    </script>
</body>
</html>
