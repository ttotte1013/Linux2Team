<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문자 인코딩 설정 -->
    <meta charset="UTF-8">

    <!-- 모바일 환경 반응형 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 웹 페이지 제목 -->
    <title>TOEIC WORD QUIZ</title>

    <style>
        /* =========================
           전체 페이지 기본 설정
           ========================= */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background-color: #faf8f5;
            color: #2c3a1a;

            /* 화면 중앙 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;

            /* 화면 전체 높이 사용 */
            height: 100vh;
        }

        /* =========================
           메인 컨테이너
           ========================= */
        .main-container {
            text-align: center;
            background-color: #ffffff;

            /* 내부 여백 */
            padding: 40px;

            /* 둥근 모서리 */
            border-radius: 16px;

            /* 그림자 효과 */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);

            width: 420px;
            box-sizing: border-box;
        }

        /* =========================
           제목 스타일
           ========================= */
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #004732;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        /* 부제목 스타일 */
        .subtitle {
            font-size: 15px;
            color: #466255;
            margin-bottom: 32px;
        }

        /* =========================
           버튼 그룹
           ========================= */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* =========================
           난이도 선택 버튼
           ========================= */
        .btn-level {
            background-color: #ffffff;
            color: #2c3a1a;

            /* 버튼 테두리 */
            border: 1px solid #e2ebda;

            padding: 18px 24px;

            font-size: 16px;
            font-weight: 600;

            border-radius: 12px;

            cursor: pointer;

            /* 버튼 텍스트 왼쪽 정렬 */
            text-align: left;

            /* 마우스 오버 시 애니메이션 */
            transition: all 0.2s ease-in-out;
        }

        /* =========================
           버튼에 마우스를 올렸을 때
           ========================= */
        .btn-level:hover {
            background-color: #edf5ed;
            border-color: #a7bfa4;
            color: #004732;

            /* 살짝 위로 이동 */
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <!-- 메인 화면 영역 -->
    <div class="main-container">

        <!-- 페이지 제목 -->
        <h1>TOEIC WORD QUIZ</h1>

        <!-- 안내 문구 -->
        <p class="subtitle">목표 점수를 선택하세요.</p>

        <!-- 난이도 선택 버튼 그룹 -->
        <div class="button-group">

            <!-- 입문 단계 선택 -->
            <button class="btn-level"
                onclick="location.href='/select_level/1'">
                입문 단계 (600점 목표)
            </button>

            <!-- 중급 단계 선택 -->
            <button class="btn-level"
                onclick="location.href='/select_level/2'">
                중급 단계 (700~800점 목표)
            </button>

            <!-- 실전 단계 선택 -->
            <button class="btn-level"
                onclick="location.href='/select_level/3'">
                실전 단계 (900점 이상 목표)
            </button>

        </div>
    </div>

</body>
</html>
