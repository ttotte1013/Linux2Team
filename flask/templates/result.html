<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Word Quiz - Result</title>
    <style>
        /* Base Reset & Layout */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background-color: #faf8f5; 
            color: #2c3a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Standard */
        .result-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 420px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Typography */
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #004732; 
            margin-bottom: 24px;
        }

        .score-display {
            font-size: 48px;
            font-weight: 800;
            color: #004732;
            margin-bottom: 8px;
        }

        .score-label {
            font-size: 16px;
            color: #466255;
            margin-bottom: 32px;
        }

        /* Feedback Section General */
        .feedback-box {
            background-color: #faf8f5;
            border-left: 4px solid #004732;
            padding: 16px;
            border-radius: 4px 12px 12px 4px;
            margin-bottom: 20px;
            text-align: left;
        }

        .feedback-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #004732;
        }

        .feedback-content {
            font-size: 14px;
            color: #466255;
            line-height: 1.5;
        }

        /* Component: Navigation Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 32px;
        }

        .btn-nav {
            background-color: #ffffff;
            color: #2c3a1a;
            border: 1px solid #e2ebda; 
            padding: 14px 20px; 
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
        }

        .btn-nav:hover {
            background-color: #edf5ed;
            border-color: #a7bfa4;
            color: #004732;
            transform: translateY(-2px); 
        }

        /* Primary Action Button Modification */
        .btn-primary {
            background-color: #004732;
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0b3c2a;
            color: #ffffff;
        }

        .feedback-content a {
            display: inline-block;
            text-decoration: none;
            color: #004732;
            font-weight: 600;
            margin-top: 6px;
        }

        .feedback-content a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="result-container">
        <h1>퀴즈 결과</h1>
        
        <div id="score" class="score-display">
            {{ score }} / {{ total }}
        </div>
        <div class="score-label">SCORE</div>

        <div class="feedback-box">
            <div class="feedback-title">단어장 추천 및 피드백</div>
            <div id="recommendation-text" class="feedback-content">
                {{ feedback }}
            </div>
        </div>

       {% if show_toeic_recommend %}
<div class="feedback-box">
    <div class="feedback-title">
        지금 토익 응시하러 가기 (아래 링크 클릭)
    </div>

    <br><br>

    <div class="feedback-content">
        <a href="{{ toeic_links.receipt }}" target="_blank">
            토익 접수하기
        </a>
        <br><br>

        <a href="{{ toeic_links.center }}" target="_blank">
            시험장 찾기
        </a>
    </div>
</div>
{% endif %}

        <div class="button-group">
            <button class="btn-nav btn-primary"
                onclick="location.href='/select_mode/{{ level }}'">
                다른 퀴즈 방식 선택하기
            </button>

            <button class="btn-nav"
                onclick="location.href='/wrongnote'">
                오답노트 보기
            </button>

            <button class="btn-nav"
                onclick="retryQuiz()">
                오답 문제 다시 풀기
            </button>

            <button class="btn-nav"
                onclick="location.href='/'">
                메인 홈으로 돌아가기
            </button>

        </div>
    </div>

<script>
async function retryQuiz() {

    const response = await fetch('/retry', {
        method: 'POST'
    });

    const data = await response.json();

    if (data.redirect) {
        window.location.href = data.redirect;
    } else {
        alert(data.error || "재시험 오류");
    }
}
</script>

</body>
</html>
