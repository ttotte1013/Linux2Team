<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC WORD QUIZ</title>

<style>
body{
    margin:0;
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    background:#faf8f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.quiz-container{
    background:#fff;
    width:500px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.05);
}

.progress{
    font-size:14px;
    font-weight:700;
    color:#555;
    margin-bottom:30px;
}

#question{
    text-align:center;
    font-size:42px;
    color:#0d3d2e;
    margin-bottom:40px;
}

#options{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.option-btn{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:16px;
    padding:22px;
    text-align:left;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.option-btn:hover{
    background:#edf5ed;
    transform:translateY(-2px);
}

.result-box{
    margin-top:30px;
    padding:22px;
    border-left:6px solid #004732;
    background:#faf8f5;
    border-radius:10px;
    display:none;
}

.result-title{
    font-size:28px;
    font-weight:700;
    color:#004732;
}

.answer-text{
    margin-top:10px;
    font-size:22px;
    font-weight:600;
}

.example-title{
    margin-top:20px;
    font-weight:700;
}

.example-text{
    margin-top:10px;
    color:#444;
    line-height:1.7;
}

.next-btn{
    margin-top:25px;
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    background:#004732;
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

.next-btn:hover{
    background:#0b3c2a;
}
</style>
</head>

<body>

<div class="quiz-container">

    <div class="progress" id="progress">
        QUIZ 1 / 10
    </div>

    <h2 id="question">
        문제 불러오는 중...
    </h2>

    <div id="options"></div>

    <!-- 정답/예문 표시 영역 -->
    <div class="result-box" id="resultBox">

        <div class="result-title" id="resultTitle">
        </div>

        <div class="answer-text" id="answerText">
        </div>

        <div class="example-title">
            💡 예문 공부하기
        </div>

        <div class="example-text" id="exampleText">
        </div>

        <button class="next-btn" onclick="nextQuiz()">
            NEXT →
        </button>
    </div>

</div>

<script>

let currentQuizData = null;
let isLastQuestion = false;

async function loadQuiz(){

    const res = await fetch("/quiz");
    const data = await res.json();

    if(data.redirect){
        location.href = data.redirect;
        return;
    }

    currentQuizData = data;

    document.getElementById("progress").innerText =
        `QUIZ ${data.current_num} / ${data.total_num}`;

    document.getElementById("question").innerText =
        data.question;

    document.getElementById("resultBox").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    data.options.forEach((opt, idx)=>{

        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${idx+1}. ${opt}`;

        btn.onclick = ()=>submitAnswer(idx+1);

        optionsDiv.appendChild(btn);
    });
}

async function submitAnswer(selected){

    const result = await fetch("/submit",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            selected:selected
        })
    });

    const data = await result.json();

    isLastQuestion = data.is_last;

    // 선택지 버튼 비활성화
    document.querySelectorAll(".option-btn")
        .forEach(btn => btn.disabled = true);

    const resultBox =
        document.getElementById("resultBox");

    resultBox.style.display = "block";

    const correctAnswer =
        currentQuizData.options[
            currentQuizData.answer - 1
        ];

    const resultTitle =
    document.getElementById("resultTitle");

    if(data.correct){

        resultTitle.innerText = "정답입니다!";
        resultTitle.style.color = "#004732";

    }else{

        resultTitle.innerText = "오답입니다!";
        resultTitle.style.color = "#d32f2f";
    }

    document.getElementById("answerText")
        .innerText =
        `정답: ${currentQuizData.answer}. ${correctAnswer}`;

    document.getElementById("exampleText")
        .innerHTML =
        currentQuizData.example || "예문 없음";
}

function nextQuiz(){

    if(isLastQuestion){
        location.href="/result";
    }else{
        loadQuiz();
    }
}

loadQuiz();

</script>

</body>
</html>
